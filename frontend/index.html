<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Voice-enabled RAG Assistant powered by MSMARCO-XI dataset">
    <title>Voice RAG Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="url(#g1)"/>
                            <path d="M2 17l10 5 10-5" stroke="url(#g2)" stroke-width="2" fill="none"/>
                            <path d="M2 12l10 5 10-5" stroke="url(#g2)" stroke-width="2" fill="none"/>
                            <defs>
                                <linearGradient id="g1" x1="2" y1="2" x2="22" y2="12">
                                    <stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
                                </linearGradient>
                                <linearGradient id="g2" x1="2" y1="12" x2="22" y2="22">
                                    <stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h1>Voice RAG Assistant</h1>
                </div>
                <div class="header-badge">
                    <span class="badge" id="status-badge">● Ready</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-card glass">
                    <div class="input-header-row">
                        <div class="input-tabs">
                            <button class="tab active" id="tab-text" onclick="switchTab('text')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
                                Text
                            </button>
                            <button class="tab" id="tab-voice" onclick="switchTab('voice')">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                                Voice
                            </button>
                        </div>
                        <div class="lang-selector-group">
                            <select id="lang-select" class="lang-select" title="Select Input Language">
                                <option value="auto">🌐 Auto-Detect</option>
                                <option value="kn">ಕನ್ನಡ (Kannada)</option>
                                <option value="hi">हिंदी (Hindi)</option>
                                <option value="te">తెలుగు (Telugu)</option>
                                <option value="ta">தமிழ் (Tamil)</option>
                                <option value="ml">മലയാളം (Malayalam)</option>
                                <option value="mr">मराठी (Marathi)</option>
                                <option value="bn">বাংলা (Bengali)</option>
                                <option value="gu">ગુજરાતી (Gujarati)</option>
                                <option value="en">English</option>
                            </select>
                        </div>
                    </div>

                    <!-- Text Input -->
                    <div class="input-mode" id="mode-text">
                        <div class="text-input-group">
                            <input type="text" id="query-input" placeholder="Ask a question..." autocomplete="off">
                            <button class="send-btn" id="send-btn" onclick="sendTextQuery()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Voice Input -->
                    <div class="input-mode hidden" id="mode-voice">
                        <div class="voice-controls">
                            <button class="mic-btn" id="mic-btn" onclick="toggleRecording()">
                                <div class="mic-ring"></div>
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="12" y1="19" x2="12" y2="23"/>
                                </svg>
                            </button>
                            <p class="mic-label" id="mic-label">Click to start recording</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Transcript -->
            <section class="transcript-section hidden" id="transcript-section">
                <div class="section-card glass">
                    <h2 class="section-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        Transcript
                    </h2>
                    <p class="transcript-text" id="transcript-text"></p>
                </div>
            </section>

            <!-- Answer -->
            <section class="answer-section hidden" id="answer-section">
                <div class="section-card glass">
                    <h2 class="section-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        Answer
                    </h2>
                    <div class="answer-text" id="answer-text"></div>
                    <div class="grounding-bar" id="grounding-bar">
                        <span>Grounding</span>
                        <div class="bar-track"><div class="bar-fill" id="grounding-fill"></div></div>
                        <span class="bar-value" id="grounding-value">—</span>
                    </div>
                </div>
            </section>

            <!-- Sources -->
            <section class="sources-section hidden" id="sources-section">
                <div class="section-card glass">
                    <h2 class="section-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Retrieved Sources
                    </h2>
                    <div class="sources-list" id="sources-list"></div>
                </div>
            </section>

            <!-- Latency -->
            <section class="latency-section hidden" id="latency-section">
                <div class="section-card glass">
                    <h2 class="section-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        Latency
                    </h2>
                    <div class="latency-grid" id="latency-grid"></div>
                </div>
            </section>

            <!-- Loading -->
            <section class="loading-section hidden" id="loading-section">
                <div class="section-card glass loading-card">
                    <div class="loader">
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                    </div>
                    <p id="loading-text">Processing query...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
