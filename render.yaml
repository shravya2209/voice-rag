services:
  - type: web
    name: voice-rag
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RETRIEVAL_MODE
        value: hybrid
      - key: TOP_K
        value: "5"
      - key: GUARDRAILS_ENABLED
        value: "true"
      - key: MIN_RELEVANCE_SCORE
        value: "0.001"
      - key: CHUNKING_STRATEGY
        value: sentence
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /api/health
